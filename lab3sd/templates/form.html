<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if employee %}Edit{% else %}Create{% endif %} Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">{% if employee %}Edit{% else %}Add New{% endif %} Employee</h4>
                </div>
                <div class="card-body">
                    <form action="{% if employee %}/edit/{{ employee.id }}{% else %}/create{% endif %}" method="post">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ employee.first_name if employee else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ employee.last_name if employee else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ employee.email if employee else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Position</label>
                            <input type="text" name="position" class="form-control" value="{{ employee.position if employee else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Equipment Model</label>
                            <input type="text" name="equipment_model" class="form-control" value="{{ employee.equipment_model if employee else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">System Account</label>
                            <input type="text" name="system_account" class="form-control" value="{{ employee.system_account if employee else '' }}" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Data</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
