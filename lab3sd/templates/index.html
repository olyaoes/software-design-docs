<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">Employee Database</h2>
    
    <div class="d-flex justify-content-between mb-3">
        <a href="/create" class="btn btn-primary">Add New Employee</a>
        <form action="/upload-file/" method="post" enctype="multipart/form-data" class="d-flex">
            <input type="file" name="file" class="form-control me-2" required>
            <button type="submit" class="btn btn-success">Upload CSV</button>
        </form>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Position</th>
                        <th>Equipment</th>
                        <th>Account</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for emp in employees %}
                    <tr>
                        <td>{{ emp.id }}</td>
                        <td>{{ emp.first_name }}</td>
                        <td>{{ emp.last_name }}</td>
                        <td>{{ emp.email }}</td>
                        <td>{{ emp.position }}</td>
                        <td>{{ emp.equipment_model }}</td>
                        <td>{{ emp.system_account }}</td>
                        <td>
                            <a href="/edit/{{ emp.id }}" class="btn btn-sm btn-warning">Edit</a>
                            <a href="/delete/{{ emp.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
