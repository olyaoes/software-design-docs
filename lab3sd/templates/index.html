<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">Employee Database</h2>
    
    <div class="d-flex align-items-center mb-4 p-3 bg-white rounded shadow-sm">
        <a href="/create" class="btn btn-primary me-2">Add New Employee</a>
        
        <form action="/quick-add-factory" method="post" class="me-2">
            <button type="submit" class="btn btn-warning fw-bold">Add via Factory</button>
        </form>

        <form action="/quick-add-adapter" method="post" class="me-4">
            <button type="submit" class="btn btn-info fw-bold text-white">Add via Adapter</button>
        </form>

        <div class="border-start ps-4">
            <form action="/upload-file/" method="post" enctype="multipart/form-data" class="d-flex align-items-center m-0">
                <input type="file" name="file" class="form-control form-control-sm me-2" style="width: 200px;" required>
                <button type="submit" class="btn btn-success btn-sm text-nowrap">Upload CSV/JSON</button>
            </form>
        </div>

        <div class="border-start ps-4 ms-2">
            <form action="/run-lab4" method="post" class="d-flex align-items-center m-0">
                <select name="output_strategy" class="form-select form-select-sm me-2" style="width: auto;">
                    <option value="console">Console</option>
                    <option value="kafka">Kafka</option>
                    <option value="redis">Redis</option>
                    <option value="default">Default / Config</option>
                </select>
                <button type="submit" class="btn btn-dark btn-sm fw-bold text-nowrap">Run Lab 4</button>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Position</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for emp in employees %}
                    <tr>
                        <td>{{ emp.id }}</td>
                        <td>{{ emp.first_name }} {{ emp.last_name }}</td>
                        <td>{{ emp.email }}</td>
                        <td>{{ emp.position }}</td>
                        <td>
                            <a href="/edit/{{ emp.id }}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a href="/delete/{{ emp.id }}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
